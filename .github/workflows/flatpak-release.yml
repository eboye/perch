name: Flatpak release

# Builds Perch.flatpak and attaches it (plus a SHA-256 file) to the GitHub release.
# Manual runs build the bundle as a workflow artifact; give a `tag` to also attach it to that release.
#
# Builds on a plain runner with a user Flatpak installation (same as build-aux/build-flatpak.sh)
# rather than the flathub-infra container: that image ships a pre-installed SDK, and when Flathub
# publishes a newer GNOME SDK build, updating it inside the container fails with
# "Invalid cross-device link".
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the bundle to (leave empty to only build)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Flatpak bundle
    runs-on: ubuntu-latest
    steps:
      # Release events check out the tagged commit; manual runs build the branch they were started on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install flatpak-builder
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q flatpak flatpak-builder appstream
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build bundle
        env:
          FLATPAK_BUILDER_ARGS: --disable-rofiles-fuse
        run: |
          build-aux/build-flatpak.sh
          sha256sum Perch.flatpak | tee Perch.flatpak.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Perch-x86_64.flatpak
          path: |
            Perch.flatpak
            Perch.flatpak.sha256
          if-no-files-found: error

  publish:
    name: Attach bundle to the release
    needs: build
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Perch-x86_64.flatpak

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          sha256sum -c Perch.flatpak.sha256
          gh release upload "$TAG" Perch.flatpak Perch.flatpak.sha256 --clobber --repo "$GITHUB_REPOSITORY"
