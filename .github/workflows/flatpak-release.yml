name: Flatpak release

# Builds Perch.flatpak with flatpak-builder and attaches it (plus a SHA-256 file) to the GitHub release.
# Run it manually (workflow_dispatch) to build without publishing; the bundle stays a workflow artifact.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Flatpak bundle
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Uploads the bundle as the artifact "Perch-x86_64.flatpak".
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40 # master, 2026-11
        with:
          manifest-path: io.github.eboye.Perch.yml
          bundle: Perch.flatpak
          cache-key: flatpak-builder-${{ github.sha }}

  publish:
    name: Attach bundle to the release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Perch-x86_64.flatpak

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          sha256sum Perch.flatpak | tee Perch.flatpak.sha256
          gh release upload "$TAG" Perch.flatpak Perch.flatpak.sha256 --clobber --repo "$GITHUB_REPOSITORY"
